[package]
name = "embassy-sync-channel"
version = "0.1.0"
authors = ["The Embedded Rustacean <166909466+theembeddedrustacean@users.noreply.github.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
esp-backtrace = { version = "0.14.1", features = [
    "esp32s3",
    "exception-handler",
    "panic-handler",
    "println",
] }
esp-hal = { version = "0.20.1", features = [ "esp32s3", "async" ] }
esp-println = { version = "0.11.0", features = ["esp32s3", "log"] }
log = { version = "0.4.21" }
esp-hal-embassy = {version = "0.3.0", features = ["esp32s3", "integrated-timers"]}
embassy-executor    = { version = "0.6.0", features = ["task-arena-size-98304"]}
embassy-futures     = "0.1.1"
embassy-sync        = "0.6.0"
embassy-time        = "0.3.2"
embedded-hal-async = "1.0.0"
embedded-io-async = "0.6.1"

[profile.dev]
# Rust debug is too slow. 
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
